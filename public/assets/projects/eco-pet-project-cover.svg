<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <radialGradient id="g1" cx="18%" cy="12%" r="85%">
      <stop offset="0%" stop-color="hsla(145, 90%, 55%, 0.35)"/>
      <stop offset="55%" stop-color="hsla(190, 90%, 55%, 0.10)"/>
      <stop offset="100%" stop-color="hsla(10, 90%, 55%, 0)"/>
    </radialGradient>
    <radialGradient id="g2" cx="92%" cy="18%" r="75%">
      <stop offset="0%" stop-color="hsla(190, 90%, 55%, 0.28)"/>
      <stop offset="60%" stop-color="hsla(145, 90%, 55%, 0.08)"/>
      <stop offset="100%" stop-color="hsla(10, 90%, 55%, 0)"/>
    </radialGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070A10"/>
      <stop offset="100%" stop-color="#061A12"/>
    </linearGradient>
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.10  0 0 0 0 0.12  0 0 0 0 0.10  0 0 0 0.25 0"/>
    </filter>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.11)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.03)"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect width="1280" height="720" fill="url(#g1)"/>
  <rect width="1280" height="720" fill="url(#g2)"/>
  <rect width="1280" height="720" filter="url(#noise)" opacity="0.22"/>

  <!-- glass card -->
  <g transform="translate(72, 420)">
    <rect x="0" y="0" width="1136" height="228" rx="28" fill="url(#glass)" stroke="rgba(255,255,255,0.10)"/>
    <text x="44" y="76" font-family="Inter, ui-sans-serif, system-ui" font-size="44" font-weight="850" fill="rgba(255,255,255,0.92)">ECO Pet Project</text>
    <text x="44" y="130" font-family="Inter, ui-sans-serif, system-ui" font-size="22" font-weight="500" fill="rgba(255,255,255,0.62)">Monitoring Dashboard • Charts • UI</text>
    <text x="44" y="190" font-family="Inter, ui-sans-serif, system-ui" font-size="16" font-weight="650" letter-spacing="2" fill="rgba(255,255,255,0.35)">ECO_PET_PROJECT</text>
  </g>

  <!-- corner accent -->
  <path d="M1280 0 L1280 140 L1140 0 Z" fill="hsla(145,90%,55%,0.22)"/>
</svg>
